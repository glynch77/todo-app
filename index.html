<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TODO-APP</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body style="background-color: darkturquoise">
    <!-- Navbar -->
    <nav class="navbar bg-body-tertiary">
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">TODO LIST</span>
      </div>
    </nav>
    <!-- Todo Card -->
    <div class="container text-center mt-5">
      <div class="card w-75 mb-3 border-0 shadow-sm rounded-4 mx-auto">
        <div class="card-body p-4">
          <h5
            class="card-title text-dark fw-bold mb-4"
            style="letter-spacing: 0.05em"
          >
            TODO APP
          </h5>

          <ul
            id="task-list"
            class="list-group text-start mx-auto mb-4"
            style="max-width: 400px"
          >
            <li class="list-group-item border-0 py-2 d-flex align-items-center">
              <input
                class="form-check-input me-3"
                type="checkbox"
                value=""
                id="firstCheckbox"
              />
              <label
                class="form-check-label text-muted fw-medium"
                for="firstCheckbox"
                >Buy milk</label
              >
            </li>
            <li class="list-group-item border-0 py-2 d-flex align-items-center">
              <input
                class="form-check-input me-3"
                type="checkbox"
                value=""
                id="secondCheckbox"
              />
              <label
                class="form-check-label text-muted fw-medium"
                for="secondCheckbox"
                >Stretch Appointment</label
              >
            </li>
            <li class="list-group-item border-0 py-2 d-flex align-items-center">
              <input
                class="form-check-input me-3"
                type="checkbox"
                value=""
                id="thirdCheckbox"
              />
              <label
                class="form-check-label text-muted fw-medium"
                for="thirdCheckbox"
                >Lunch With Friends</label
              >
            </li>
          </ul>

          <div class="d-flex gap-3 justify-content-center mt-4">
            <button
              id="add-task-button"
              type="button"
              class="btn btn-primary px-4 rounded-pill fw-semibold"
              data-bs-toggle="modal"
              data-bs-target="#myModal"
            >
              Add task
            </button>

            <button
              type="button"
              id="delete-task-button"
              class="btn btn-light border px-4 rounded-pill fw-semibold text-secondary"
            >
              Delete Task
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Add Task Modal -->
    <div class="modal" id="myModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Add Task</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form id="task-form">
              <div class="mb-3">
                <label for="task-title" class="form-label">Task</label>
                <input
                  type="text"
                  class="form-control"
                  id="task-title"
                  placeholder="e.g. Buy milk"
                />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button type="button" id="save-task-button" class="btn btn-primary">Save changes</button>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="js/main.js"></script>
  </body>
</html>
